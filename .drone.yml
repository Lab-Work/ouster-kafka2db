kind: pipeline
type: kubernetes
name: build-and-deploy

platform:
  os: linux
  arch: amd64

# Build + deploy from the default branch only: feature-branch pushes and PRs
# must not push images or bump the k8s manifest.
# trigger:
#   branch:
#     - main
#   event:
#     - push

steps:
  - name: clone-private-repo
    image: alpine/git
    environment:
      GITHUB_TOKEN:
        from_secret: GITHUB_PUSH_TOKEN
    commands:
      - git clone https://$GITHUB_TOKEN@github.com/Lab-Work/lv_telemetry_connector ./lv_telemetry_connector
      - git clone https://$GITHUB_TOKEN@github.com/Lab-Work/lv_kafka_connector ./lv_kafka_connector
      - git clone https://$GITHUB_TOKEN@github.com/Lab-Work/lv_db_connector ./lv_db_connector
  - name: build-image
    # Pinned: plugins/docker:latest ships Docker 20.10 built against iptables-legacy,
    # whose nat table does not exist on Talos nodes, so its embedded dockerd never starts.
    image: plugins/docker:21.3.4
    settings:
      repo: docker.mogi.io/ouster-kafka2db
      platform: linux/amd64
      tags:
        - ${DRONE_COMMIT_SHA}
      registry: docker.mogi.io
      username:
        from_secret: DOCKER_USERNAME
      password:
        from_secret: DOCKER_PASSWORD
      # Vestigial: the Dockerfile no longer pip-installs from GitHub, so this
      # build arg is unused and Docker will warn it wasn't consumed. The
      # connectors now arrive via the clone-private-repo step above. Kept so
      # the token is already wired if that install is ever restored. NOTE the
      # clone embeds the token in each clone's .git/config, which is why
      # .dockerignore excludes **/.git — otherwise `COPY . .` in the final
      # stage would bake it into the pushed image.
      build_args_from_env:
        - GITHUB_TOKEN
    environment:
      GITHUB_TOKEN:
        from_secret: GITHUB_PUSH_TOKEN

  - name: update-k8s-manifests
    image: alpine/git
    environment:
      GIT_AUTHOR_NAME: "blegas78"
      GIT_AUTHOR_EMAIL: "12centdwarf@gmail.com"
      GITHUB_PUSH_TOKEN:
        from_secret: GITHUB_PUSH_TOKEN
    commands:
      - apk add --no-cache curl
      - curl -L https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -o /usr/bin/yq
      - chmod +x /usr/bin/yq
      - git config --global user.name $GIT_AUTHOR_NAME
      - git config --global user.email $GIT_AUTHOR_EMAIL
      - git clone https://$GITHUB_PUSH_TOKEN@github.com/blegas78/k8s-manifests-backend.git
      - cd k8s-manifests-backend
      - yq eval '.spec.template.spec.containers[0].image = "docker.mogi.io/ouster-kafka2db:${DRONE_COMMIT_SHA}"' -i 2kafka/ouster-kafka2db/deployment.yaml
      # If the manifest already points at this commit (e.g. it was set by
      # hand to match, or this build is a re-run of one that already
      # updated it), yq's rewrite is a no-op and `git commit -am` would
      # exit non-zero on "nothing to commit", failing the whole step even
      # though there's genuinely nothing wrong. Only commit/push when the
      # rewrite actually changed something.
      - |
        if git diff --quiet; then
          echo "manifest already references ${DRONE_COMMIT_SHA} - nothing to commit"
          echo "unchanged" > ../manifest-status
        else
          git commit -am "Update image to ${DRONE_COMMIT_SHA}"
          git push https://$GITHUB_PUSH_TOKEN@github.com/blegas78/k8s-manifests-backend.git HEAD:main
          echo "changed" > ../manifest-status
        fi

  - name: warn-if-manifest-unchanged
    image: alpine/git
    failure: ignore
    commands:
      - |
        status=$(cat manifest-status 2>/dev/null || echo "unknown")
        if [ "$status" = "unchanged" ]; then
          echo "=============================================================="
          echo "WARNING: this build did NOT change the k8s manifest."
          echo "It already pointed at docker.mogi.io/ouster-kafka2db:${DRONE_COMMIT_SHA}"
          echo "before this build ran. If you expected this build to deploy new"
          echo "code, check that your latest commit was actually pushed before"
          echo "triggering the build."
          echo "=============================================================="
          exit 1
        elif [ "$status" = "changed" ]; then
          echo "manifest was updated this build - no warning needed."
        else
          echo "manifest-status marker not found - update-k8s-manifests may not have run as expected."
          exit 1
        fi
